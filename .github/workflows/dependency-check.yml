name: OWASP Dependency Check

on:
  push:
    branches:
      - main
      - master

  pull_request:

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Criar diretórios
        run: |
          mkdir -p reports
          mkdir -p odc-data

      - name: Restaurar cache da base do Dependency Check
        uses: actions/cache@v4
        with:
          path: odc-data
          key: dependency-check-${{ runner.os }}
          restore-keys: |
            dependency-check-

      - name: Executar OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          docker run --rm \
            -u root \
            -e NVD_API_KEY="$NVD_API_KEY" \
            -v ${{ github.workspace }}:/src \
            -v ${{ github.workspace }}/odc-data:/usr/share/dependency-check/data \
            owasp/dependency-check:12.1.8 \
            --scan /src \
            --format HTML \
            --out /src/reports \
            --disableYarnAudit \
            --nvdApiKey "$NVD_API_KEY"

      - name: Upload do relatório
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: reports/dependency-check-report.html